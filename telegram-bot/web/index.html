<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 20px; }
    h1 { margin-top: 0; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); padding: 16px; margin-bottom: 16px; }
    .flex { display: flex; gap: 12px; flex-wrap: wrap; }
    label { display: block; font-size: 14px; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 12px; background: #1976d2; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button.secondary { background: #555; }
    button.danger { background: #c62828; }
    .group-header { display: flex; justify-content: space-between; align-items: center; }
    .task { padding: 8px; border: 1px solid #eee; border-radius: 6px; margin-bottom: 8px; background: #fafafa; }
    .overdue { border-color: #c62828; color: #c62828; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .muted { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Групповые задачи</h1>

  <div class="card">
    <h2>Создать новую группу задач</h2>
    <div class="flex">
      <div style="flex:1">
        <label>Текст задачи</label>
        <textarea id="taskText" rows="2"></textarea>
      </div>
      <div style="flex:1">
        <label>Дедлайн (ДД.ММ.ГГГГ)</label>
        <input id="deadline" type="text" placeholder="01.01.2025">
      </div>
      <div style="flex:1">
        <label>ID группы (Telegram)</label>
        <input id="groupId" type="text" placeholder="-1001234567890">
      </div>
      <div style="flex:1">
        <label>Исполнители (@user1, @user2)</label>
        <input id="assignees" type="text" placeholder="@user1, @user2">
      </div>
    </div>
    <div style="margin-top:12px">
      <button onclick="createGroup()">Создать группу</button>
    </div>
  </div>

  <div id="groups"></div>

  <script>
    async function fetchJson(url, options = {}) {
      const response = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options));
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || 'Ошибка запроса');
      }
      return response.json();
    }

    function groupTasks(tasks) {
      const groupsMap = new Map();

      tasks.forEach(task => {
        const key = String(task.group_task_id || task.id);

        if (!groupsMap.has(key)) {
          groupsMap.set(key, {
            id: key,
            group_task_id: task.group_task_id,
            task_text: task.task_text,
            deadline: task.deadline,
            group_id: task.group_id,
            tasks: [task]
          });
        } else {
          groupsMap.get(key).tasks.push(task);
        }
      });

      return Array.from(groupsMap.values());
    }

    async function loadTasks() {
      const data = await fetchJson('/api/tasks');
      renderGroups(groupTasks(data.tasks || []));
    }

    function renderGroups(groups) {
      const container = document.getElementById('groups');
      container.innerHTML = '';

      groups.forEach(group => {
        const card = document.createElement('div');
        card.className = 'card';

        const header = document.createElement('div');
        header.className = 'group-header';
        header.innerHTML = `<div><strong>Группа ${group.id}</strong><div class="muted">${group.task_text} · до ${group.deadline}</div></div>`;

        const actions = document.createElement('div');
        actions.className = 'actions';
        const addBtn = document.createElement('button');
        addBtn.textContent = 'Добавить исполнителей';
        addBtn.onclick = () => addAssignees(group);

        const editBtn = document.createElement('button');
        editBtn.className = 'secondary';
        editBtn.textContent = 'Редактировать группу';
        editBtn.onclick = () => editGroup(group);

        actions.append(addBtn, editBtn);
        header.appendChild(actions);
        card.appendChild(header);

        group.tasks.forEach(task => {
          const t = document.createElement('div');
          t.className = 'task';
          if (task.is_overdue) t.classList.add('overdue');
          t.innerHTML = `
            <div><strong>ID ${task.id}</strong> — ${task.assigned_to}</div>
            <div>${task.task_text}</div>
            <div class="muted">Срок: ${task.deadline} · Статус: ${task.status}</div>
            <div class="actions" style="margin-top:6px">
              <button class="secondary" onclick="toggleStatus(${task.id}, '${task.status}')">${task.status === 'completed' ? 'Сделать активной' : 'Завершить'}</button>
              <button class="secondary" onclick="reassign(${task.id})">Переадресовать</button>
              <button class="danger" onclick="removeTask(${task.id})">Удалить</button>
            </div>
          `;
          card.appendChild(t);
        });

        container.appendChild(card);
      });
    }

    async function createGroup() {
      const taskText = document.getElementById('taskText').value.trim();
      const deadline = document.getElementById('deadline').value.trim();
      const groupId = document.getElementById('groupId').value.trim();
      const assignees = document.getElementById('assignees').value.split(',').map(a => a.trim()).filter(Boolean);
      if (!taskText || !deadline || !assignees.length) {
        alert('Заполните текст, срок и исполнителей');
        return;
      }
      await fetchJson('/api/tasks', {
        method: 'POST',
        body: JSON.stringify({ task_text: taskText, deadline, group_id: groupId, assigned_to: assignees })
      });
      await loadTasks();
      document.getElementById('taskText').value = '';
      document.getElementById('deadline').value = '';
      document.getElementById('assignees').value = '';
    }

    async function addAssignees(group) {
      const users = prompt('Добавить исполнителей через запятую (@user1, @user2):');
      if (!users) return;
      const assignees = users.split(',').map(a => a.trim()).filter(Boolean);
      if (!assignees.length) return;

      await fetchJson('/api/tasks', {
        method: 'POST',
        body: JSON.stringify({
          task_text: group.task_text,
          deadline: group.deadline,
          group_id: group.group_id,
          group_task_id: group.group_task_id || group.id,
          assigned_to: assignees
        })
      });
      await loadTasks();
    }

    async function editGroup(group) {
      const text = prompt('Новый текст задачи', group.task_text);
      if (text === null) return;
      const deadline = prompt('Новый срок (ДД.ММ.ГГГГ)', group.deadline);
      if (deadline === null) return;
      const groupId = prompt('Новый group_id (Telegram)', group.group_id || '');
      if (groupId === null) return;

      const taskId = group.tasks[0].id;
      await fetchJson(`/api/tasks/${taskId}`, {
        method: 'PUT',
        body: JSON.stringify({ group_operation: true, task_text: text, deadline, group_id: groupId })
      });
      await loadTasks();
    }

    async function toggleStatus(taskId, currentStatus) {
      const newStatus = currentStatus === 'completed' ? 'active' : 'completed';
      await fetchJson(`/api/tasks/${taskId}`, {
        method: 'PUT',
        body: JSON.stringify({ status: newStatus })
      });
      await loadTasks();
    }

    async function reassign(taskId) {
      const user = prompt('Новый исполнитель (@user)');
      if (!user) return;
      await fetchJson(`/api/tasks/${taskId}`, {
        method: 'PUT',
        body: JSON.stringify({ assigned_to: user })
      });
      await loadTasks();
    }

    async function removeTask(taskId) {
      if (!confirm('Удалить подзадачу?')) return;
      const res = await fetchJson(`/api/tasks/${taskId}`, { method: 'DELETE' });
      alert(`Осталось задач в группе: ${res.remaining_in_group}`);
      await loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
